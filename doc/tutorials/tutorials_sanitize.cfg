# See https://docs.python.org/3/library/re.html

[regex1]
regex: (?<=Completed \| )\d+\.\d* \w+
replace: TIME
# Example: [#] | 100% Completed | 303.49 ms -> [#] | 100% Completed | TIME

[regex2]
regex: \d+.\d+ (?=patterns/s)
replace: N
# Example: 1.2 patterns/s -> N_PATTERNS patterns/s

[regex3]
regex: \d+.\d+ (?=comparisons/s)
replace: N
# Example: 1.5 comparisons/s -> N comparisons/s

[regex4]
regex: ^100%(.*)it/s\]$
replace: TQDM_PROGRESSBAR

[regex5]
regex: (?<=Figure size )\d+x\d+.\d+
replace: FIGURE_SIZE
# Example: Figure size 640x408.116 -> Figure size FIGURE_SIZE

[regex6]
regex: (?<=Refining )\d+
replace: N
# Example: Refining 12900 orientation(s) -> Refining N orientation(s)

[regex7]
regex: (?<=Matching )\d+/\d+
replace: M/N
# Example: Matching 12871/29800 -> Matching M/N

[regex8]
regex: (?<=PyOpenCL: )(True|False)
replace: BOOL
# Example: PyOpenCL: False -> PyOpenCL: BOOL
# (the weekly workflow installs pyopencl; local runs may not)

[regex9]
regex: in \d+ chunk\(s\)( of up to \d+ pattern\(s\))?
replace: in N chunk(s)
# Example: Indexing 4125 pattern(s) in 275 chunk(s) of up to 15
# pattern(s) -> Indexing 4125 pattern(s) in N chunk(s)

[regex10]
regex: (median residual|worst strain component error|worst rotation component error|largest \|sigma_33\||stress amplitude|largest shear strain difference between the closures|largest e33 difference between the closures|recovered from the patterns|\ba3|\ba5|\ba9): [-+]?\d\.\d+e[-+]\d+
replace: \1: VALUE
# Example: worst strain component error: 1.0e-05 ->
# worst strain component error: VALUE
# (hrebsd_dic.ipynb; each label is named rather than anchoring on
# ": " alone, so the quantities that do NOT come out of a fit -- the
# analytically imposed distortion, strain amplitude and GND density
# -- stay compared literally.  A fit converges to `min_step` 1e-3 px
# of corner displacement, so a scikit-image change to the
# `phase_cross_correlation` seed moves the third significant digit of
# anything derived from it)

[regex11]
regex: largest iteration count: \d+
replace: largest iteration count: N
# Example: largest iteration count: 3 -> largest iteration count: N
# (three of the 49 fits exit within 3 to 13 per cent of the min_step
# threshold, so one of them can take a fourth iteration on another
# library version -- measured 2026-09-08, Stage C fix gate)

[regex12]
regex: (?<=median HR-KAM: )\d+\.\d+
replace: VALUE
# Example: median HR-KAM: 0.19 mrad -> median HR-KAM: VALUE mrad

[regex13]
regex: (?<=: )[-+]?\d+\.\d+ to [-+]?\d+\.\d+ px
replace: VALUE to VALUE px
# Example: translation_x: -0.169 to 0.333 px ->
# translation_x: VALUE to VALUE px
# (three decimals of a quantity whose convergence scale is 1e-3 px)
